name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: 开发约束检查
        run: bash scripts/check-rules.sh
      - name: go vet
        run: go vet ./...
      - name: go vet (windows)
        run: GOOS=windows GOARCH=amd64 go vet ./...
      - name: 测试
        run: go test ./...
