name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: 检查与测试
        run: |
          bash scripts/check-rules.sh
          go vet ./...
          go test ./...

      - name: 编译
        env:
          CGO_ENABLED: '0'
        run: |
          VERSION="${GITHUB_REF_NAME}"
          LDFLAGS="-s -w -X work-ledger/internal/server.Version=${VERSION}"
          mkdir -p dist
          GOOS=linux   GOARCH=amd64 go build -trimpath -ldflags "$LDFLAGS" -o dist/work-ledger-linux-amd64       ./cmd/work-ledger
          GOOS=linux   GOARCH=arm64 go build -trimpath -ldflags "$LDFLAGS" -o dist/work-ledger-linux-arm64       ./cmd/work-ledger
          GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "$LDFLAGS" -o dist/work-ledger-windows-amd64.exe ./cmd/work-ledger
          cp deploy/install.sh deploy/install.ps1 dist/
          cd dist
          sha256sum work-ledger-* install.sh install.ps1 > sha256sums.txt
          cat > version.json <<JSON
          {
            "version": "${VERSION}",
            "published_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "assets": {
              "linux-amd64": "work-ledger-linux-amd64",
              "linux-arm64": "work-ledger-linux-arm64",
              "windows-amd64": "work-ledger-windows-amd64.exe"
            }
          }
          JSON
          cat sha256sums.txt

      - name: 发布 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "${GITHUB_REF_NAME}" \
            --notes "工作台账 ${GITHUB_REF_NAME}

          一键部署（服务器无法访问 github.com 时已使用 github.tool.do 代理）：

          Linux：
          \`curl -fsSL https://github.tool.do/yooer/work-ledger/raw/main/deploy/install.sh | sudo bash\`

          Windows（管理员 PowerShell）：
          \`irm https://github.tool.do/yooer/work-ledger/raw/main/deploy/install.ps1 | iex\`

          已部署的服务器升级：\`sudo wlctl upgrade\`"
