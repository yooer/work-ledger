{{define "content"}}<div class="row justify-content-center"><div class="col-lg-7">
<form class="card" data-ajax data-url="/departments/ajax" data-action="save" novalidate>
    <input type="hidden" name="id" value="{{.Old.id}}">
    <div class="card-header"><h3 class="card-title">{{.PageTitle}}</h3></div>
    <div class="card-body">
        <div class="mb-3">
            <label class="form-label required" for="d-name">部门名称</label>
            <input class="form-control" id="d-name" type="text" name="name" value="{{.Old.name}}" maxlength="60" required>
            <div class="form-hint">2-60 个字，全局唯一。</div>
        </div>
        <div class="mb-3">
            <label class="form-label" for="d-parent">上级部门</label>
            <select class="form-select" id="d-parent" name="parent_id">
                <option value="0">无（作为一级部门）</option>
                {{$pid := .Old.parent_id}}{{range .Parents}}<option value="{{.id}}"{{if same .id $pid}} selected{{end}}>{{.label}}{{if ne .is_active 1}}（已停用）{{end}}</option>{{end}}
            </select>
            <div class="form-hint">部门不限层级，可以选择任何部门作为上级；不能选择本部门或它的下级部门。</div>
        </div>
        <div class="row">
            <div class="col-sm-6 mb-3">
                <label class="form-label" for="d-sort">排序</label>
                <input class="form-control" id="d-sort" type="number" name="sort_order" value="{{.Old.sort_order}}" min="-999" max="999">
                <div class="form-hint">数值越小越靠前。</div>
            </div>
            <div class="col-sm-6 mb-3">
                <label class="form-label">状态</label>
                <label class="form-check form-switch mt-2">
                    <input class="form-check-input" type="checkbox" name="is_active" value="1"{{if same .Old.is_active 1}} checked{{end}}>
                    <span class="form-check-label">启用</span>
                </label>
            </div>
        </div>
    </div>
    <div class="card-footer d-flex justify-content-between">
        <a class="btn btn-link" href="/departments">返回列表</a>
        <button type="submit" class="btn btn-primary">{{icon "check"}}保存</button>
    </div>
</form>
</div></div>{{end}}
