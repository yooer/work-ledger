{{define "content"}}<div class="row justify-content-center">
    <div class="col-lg-6">
        <form class="card" data-ajax data-url="/password/ajax" data-action="update" novalidate>
            <div class="card-header"><h3 class="card-title">修改登录密码</h3></div>
            <div class="card-body">
                <div class="mb-3">
                    <label class="form-label required" for="pw-current">当前密码</label>
                    <input class="form-control" id="pw-current" type="password" name="current_password" autocomplete="current-password" required>
                </div>
                <div class="mb-3">
                    <label class="form-label required" for="pw-new">新密码</label>
                    <input class="form-control" id="pw-new" type="password" name="new_password" autocomplete="new-password" minlength="8" required>
                    <div class="form-hint">至少 8 位，建议包含大小写字母、数字和符号。</div>
                </div>
                <div class="mb-3">
                    <label class="form-label required" for="pw-confirm">确认新密码</label>
                    <input class="form-control" id="pw-confirm" type="password" name="new_password_confirmation" autocomplete="new-password" required>
                </div>
            </div>
            <div class="card-footer d-flex justify-content-between">
                <a class="btn btn-link" href="/security">账号安全</a>
                <button type="submit" class="btn btn-primary">{{icon "check"}}保存新密码</button>
            </div>
        </form>
    </div>
</div>{{end}}
